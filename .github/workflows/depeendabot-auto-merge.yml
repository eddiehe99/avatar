name: Dependabot Auto Merge

on:
  pull_request:

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ahmadnassri/action-dependabot-auto-merge@v2
        with:
          target: minor, patch
          github-token: ${{ secrets.AUTO_MERGE_ACCESS_TOKEN }}